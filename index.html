<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ather Energy — Investor Intelligence Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  
  <style>
    :root {
      --bg: #fbfbf9;
      --card-bg: #ffffff;
      --text-main: #111111;
      --text-muted: #666666;
      --border: #e2e2dc;
      --accent: #2e7d32;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, sans-serif;
      line-height: 1.5;
      padding: 1.5rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      border-bottom: 3px double var(--text-main);
      padding-bottom: 1.5rem;
      margin-bottom: 2rem;
      text-align: center;
    }

    .masthead {
      font-family: 'Newsreader', serif;
      font-size: 2.75rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      margin-bottom: 0.25rem;
    }

    .subhead {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Ticker Bar */
    .ticker-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 2.5rem;
    }

    .ticker-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 1rem;
      border-radius: 4px;
    }

    .ticker-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 0.25rem;
    }

    .ticker-value {
      font-family: 'Newsreader', serif;
      font-size: 1.5rem;
      font-weight: 600;
    }

    /* Section Headers */
    .section-title {
      font-family: 'Newsreader', serif;
      font-size: 1.5rem;
      border-bottom: 1px solid var(--text-main);
      padding-bottom: 0.5rem;
      margin-bottom: 1.5rem;
    }

    /* Sources Grid */
    .sources-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
    }

    .source-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 1.25rem;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: border-color 0.2s ease;
    }

    .source-card:hover {
      border-color: var(--text-main);
    }

    .badge {
      display: inline-block;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 0.2rem 0.5rem;
      background: #f0f0eb;
      font-weight: 600;
      border-radius: 2px;
      margin-bottom: 0.75rem;
      width: fit-content;
    }

    .source-name {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .source-desc {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-bottom: 1.25rem;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px dashed var(--border);
      padding-top: 0.75rem;
      margin-top: auto;
    }

    .source-date {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .source-link {
      color: var(--text-main);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .source-link:hover {
      text-decoration: underline;
    }

    .loading {
      color: var(--text-muted);
      font-style: italic;
    }
  </style>
</head>
<body>

  <header>
    <h1 class="masthead">The Ather Gazette</h1>
    <p class="subhead">Stock Tracking & Source Hub • Automated via Google Sheets</p>
  </header>

  <h2 class="section-title">Live Valuation Indicators</h2>
  <div class="ticker-grid" id="ticker-container">
    <p class="loading">Loading financial data...</p>
  </div>

  <h2 class="section-title">Verified Intelligence Sources</h2>
  <div class="sources-grid" id="sources-container">
    <p class="loading">Loading sources feed...</p>
  </div>

  <script>
    // -------------------------------------------------------------
    // REPLACE THESE TWO URLS WITH YOUR ACTUAL PUBLISHED CSV LINKS:
    // -------------------------------------------------------------
    const LIVE_DATA_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQqBuCJPUe7GR8mtAYRrj9u6071aYdZ0PuRs-Ui2xR8nOjUIv6gwTNqCf2lR0OXi_0vf5p5EvZt0jNT/pub?gid=0&single=true&output=csv';
    const NEWS_DESK_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQqBuCJPUe7GR8mtAYRrj9u6071aYdZ0PuRs-Ui2xR8nOjUIv6gwTNqCf2lR0OXi_0vf5p5EvZt0jNT/pub?gid=1553817120&single=true&output=csv';

    // Fetch Live Ticker Data
    <script>
    // YOUR PUBLISHED GOOGLE SHEET CSV LINKS
    const LIVE_DATA_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQqBuCJPUe7GR8mtAYRrj9u6O71aYdZ0PuRs-Ui2xR8nOjUlv6gwTNqCf2lR0OXi_0vf5p5EvZt0JNT/pub?gid=0&single=true&output=csv';
    const NEWS_DESK_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQqBuCJPUe7GR8mtAYRrj9u6O71aYdZ0PuRs-Ui2xR8nOjUlv6gwTNqCf2lR0OXi_0vf5p5EvZt0JNT/pub?gid=1553817120&single=true&output=csv';

    // Fetch Live Ticker Data
    Papa.parse(LIVE_DATA_CSV_URL, {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: function(results) {
        console.log("Live Data Results:", results);
        const container = document.getElementById('ticker-container');
        if (results.data && results.data.length > 0) {
          container.innerHTML = '';
          results.data.forEach(row => {
            if (row.Metric && row.Value) {
              const card = document.createElement('div');
              card.className = 'ticker-card';
              card.innerHTML = `
                <div class="ticker-label">${row.Metric}</div>
                <div class="ticker-value">${row.Value}</div>
              `;
              container.appendChild(card);
            }
          });
        }
      },
      error: function(err) {
        console.error("Ticker Error:", err);
      }
    });

    // Fetch Intelligence Sources
    Papa.parse(NEWS_DESK_CSV_URL, {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: function(results) {
        console.log("News Desk Results:", results);
        const container = document.getElementById('sources-container');
        if (results.data && results.data.length > 0) {
          container.innerHTML = '';
          results.data.forEach(row => {
            if (row.Source_Name && row.Website_URL) {
              const card = document.createElement('div');
              card.className = 'source-card';
              card.innerHTML = `
                <div>
                  <span class="badge">${row.Category || 'General'}</span>
                  <h3 class="source-name">${row.Source_Name}</h3>
                  <p class="source-desc">${row.Description || ''}</p>
                </div>
                <div class="card-footer">
                  <span class="source-date">Verified: ${row.Source_Date || 'N/A'}</span>
                  <a class="source-link" href="${row.Website_URL}" target="_blank" rel="noopener">Open Portal &rarr;</a>
                </div>
              `;
              container.appendChild(card);
            }
          });
        }
      },
      error: function(err) {
        console.error("Sources Error:", err);
      }
    });
  </script>

</body>
</html>
